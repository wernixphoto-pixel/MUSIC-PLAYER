<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}
</style>
</head>

<body>

<script>
const AUDIO_URL =
    "music/lagu1.mp3";

let audioContext;
let audio;
let source;
let destination;

async function startAudio() {

    try {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        audio =
            new Audio();

        audio.src = AUDIO_URL;

        audio.crossOrigin = "anonymous";

        audio.loop = true;

        audio.preload = "auto";

        /*
         * Masukkan audio ke Web Audio API
         */
        source =
            audioContext.createMediaElementSource(audio);

        /*
         * Buat MediaStream destination
         */
        destination =
            audioContext.createMediaStreamDestination();

        /*
         * Audio → MediaStream
         */
        source.connect(destination);

        /*
         * Tetap kirim ke output WebView
         * untuk membantu mempertahankan playback.
         */
        source.connect(audioContext.destination);

        /*
         * Mulai AudioContext
         */
        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        /*
         * Putar lagu
         */
        await audio.play();

        console.log(
            "Audio berhasil dimulai"
        );

        console.log(
            "Audio state:",
            audioContext.state
        );

        console.log(
            "Tracks:",
            destination.stream.getAudioTracks().length
        );

        /*
         * Simpan stream supaya bisa
         * kita akses untuk tahap berikutnya.
         */
        window.audioStream =
            destination.stream;

    } catch (error) {

        console.log(
            "Audio error:",
            error
        );
    }
}


/*
 * Mulai setelah halaman dibuka
 */
startAudio();

</script>

</body>
</html>
